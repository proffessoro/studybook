# Local development services only. The production stack (deploy/docker-compose.yml) comes in step 1.1 #9.
name: studybook-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: studybook
      POSTGRES_PASSWORD: studybook
      POSTGRES_DB: studybook
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 images keep data under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybook"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine
    ports:
      - "6379:6379"

  # Catches every email sent in development. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
